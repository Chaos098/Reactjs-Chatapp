<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>A2 · Đăng ký · ChatApp</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/a1f34fe590b998022247038c6de8902e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app theme-{{theme}}" style="width: 1440px; height: 900px">
<main class="auth">
<div class="auth-card">
<div class="auth-brand"><span class="logo" aria-hidden="true"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg></span>ChatApp</div>
<div class="col" style="gap: 6px"><h1 class="t-h1">Tạo tài khoản</h1><p class="c2">Chỉ mất một phút để bắt đầu nhắn tin với bạn bè.</p></div>
<div class="col" style="gap: 16px">
<div class="field"><label class="label" for="reg-name">Tên người dùng</label><div class="input "><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><input id="reg-name" type="text" placeholder="vd: tuankiet" value="tuankiet" /></div><span class="hint">3–20 ký tự: chữ thường, số hoặc dấu gạch dưới</span></div>
<div class="field"><label class="label" for="reg-email">Email</label><div class="input "><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><input id="reg-email" type="text" placeholder="ban@email.com" value="tuankiet@gmail.com" /></div></div>
<div class="field"><label class="label" for="reg-pw">Mật khẩu</label><div class="input "><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input id="reg-pw" type="password" placeholder="Tối thiểu 8 ký tự" value="matkhau123" /><button class="ibtn sm" aria-label="Hiện mật khẩu" style="margin-right: -6px"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
<div class="field"><label class="label" for="reg-pw2">Nhập lại mật khẩu</label><div class="input error"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input id="reg-pw2" type="password" placeholder="Nhập lại mật khẩu" value="matkhau12" /></div><span class="hint err">Mật khẩu nhập lại không khớp</span></div>
</div>
<a class="btn btn-primary btn-lg btn-block" href="C2-NoConversation.dc.html">Tạo tài khoản</a>
<p class="t-small c2" style="text-align: center">Đã có tài khoản? <a class="link" href="A1-Login.dc.html">Đăng nhập</a></p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["mono-light","mono-dark","indigo-light"],"default":"mono-light","section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'mono-light' };
  }
}
</script>
</body>
</html>
